name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      # Compiler output is not readable from outside Actions, so surface it as check-run
      # annotations (which are readable through the API).
      - name: Report Kotlin errors
        if: always()
        run: |
          cat test.log assemble.log > ci.log 2>/dev/null || true
          [ -f ci.log ] || exit 0
          total=$(grep -cE '^e: ' ci.log || true)
          echo "::error::Kotlin compile errors: ${total:-0}"
          grep -E '^e: ' ci.log | sed -E 's|file:///[^ ]*/app/|app/|' | sort -u | head -38 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          grep -E 'requires libraries|compile against version|AAR metadata|Could not resolve|Unresolved reference|Caused by:' ci.log \
            | sed -E 's/^ +//' | sort -u | head -6 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          sed -n '/What went wrong:/,/Try:/p' ci.log | sed -E 's/^ +//' | grep -v '^$' | head -10 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-buddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
