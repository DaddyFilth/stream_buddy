name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee test.log

      # Lint errors fail the build; the warning backlog does not.
      - name: Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

      # Compiles the instrumentation tests (running them needs an emulator: see emulator.yml).
      - name: Compile instrumented tests
        run: |
          set -o pipefail
          ./gradlew assembleDebugAndroidTest --stacktrace --console=plain 2>&1 | tee androidtest.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      # Decodes the release keystore from a repository secret, if one is configured.
      # Secrets cannot be referenced in `if:` conditions, so the check happens in the shell.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMBUDDY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STREAMBUDDY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No STREAMBUDDY_KEYSTORE_BASE64 secret; the release build will be unsigned."
          fi

      # R8 + resource shrinking — the same code path a Play Store upload takes.
      - name: Assemble release (R8)
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --stacktrace --console=plain 2>&1 | tee release.log
        env:
          STREAMBUDDY_KEYSTORE_PASS: ${{ secrets.STREAMBUDDY_KEYSTORE_PASS }}
          STREAMBUDDY_KEY_ALIAS: ${{ secrets.STREAMBUDDY_KEY_ALIAS }}
          STREAMBUDDY_KEY_PASS: ${{ secrets.STREAMBUDDY_KEY_PASS }}

      # Compiler output is not readable from outside Actions, so surface it as check-run
      # annotations (which are readable through the API).
      - name: Report build errors
        if: always()
        run: |
          cat test.log lint.log androidtest.log assemble.log release.log > ci.log 2>/dev/null || true
          [ -f ci.log ] || exit 0
          total=$(grep -cE '^e: ' ci.log || true)
          echo "::error::Kotlin compile errors: ${total:-0}"
          grep -E '^e: ' ci.log | sed -E 's|file:///[^ ]*/app/|app/|' | sort -u | head -30 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          grep -E 'FAILED|There were failing tests|Execution failed for task|Lint found' ci.log \
            | grep -vE '^e: ' | sed -E 's/^ +//' | sort -u | head -8 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          # Every lint error, one annotation each.
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            grep -E '^[^ ].*: (Error|Warning): ' app/build/reports/lint-results-debug.txt \
              | sed -E 's|/home/runner/work/stream_buddy/stream_buddy/||' | sort -u | head -14 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          fi
          sed -n '/What went wrong:/,/Try:/p' ci.log | sed -E 's/^ +//' | grep -v '^$' | head -12 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-buddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK + AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-buddy-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  emulator:
    name: Instrumented smoke tests (emulator)
    # Slow and flaky-ish, so it is opt-in: run it from the Actions tab before a release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace --console=plain
